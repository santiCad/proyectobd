# Configuración de Base de Datos Oracle
# ============================================================
# Cambia estos valores según tu entorno Oracle
# ============================================================

# URL de conexión JDBC
# Formato estándar:  jdbc:oracle:thin:@HOST:PORT/SERVICE_NAME
# Universidad Javeriana (servidor local):
db.url=jdbc:oracle:thin:@localhost:1521/FREEPDB1

# Si usas el servidor de la universidad, cambia a:
# db.url=jdbc:oracle:thin:@servidor-universidad:1521/XE

# Credenciales
db.user=SYSTEM
db.password=tu_password_aqui

# Pool de conexiones
db.pool.maxSize=10
db.pool.minIdle=2
db.pool.connectionTimeout=30000
